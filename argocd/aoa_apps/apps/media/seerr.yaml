apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: in-cluster
    namespace: seerr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        goldilocks.fairwinds.com/enabled: "true"
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: seerr
        valuesObject:
          controllers:
            seerr:
              annotations:
                reloader.stakater.com/auto: "true"
              containers:
                app:
                  image:
                    repository: ghcr.io/seerr-team/seerr
                    # renovate: datasource=docker depName=ghcr.io/seerr-team/seerr
                    tag: v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
                  env:
                    TZ: America/Denver
                    LOG_LEVEL: "info"
                    PORT: &port 5055
                    # keep npm from writing to /home/node on the read-only root fs
                    npm_config_cache: /tmp/.npm
                  probes:
                    liveness: &probes
                      enabled: true
                      custom: true
                      spec:
                        httpGet:
                          path: /api/v1/settings/public
                          port: *port
                        initialDelaySeconds: 0
                        periodSeconds: 10
                        timeoutSeconds: 3
                        failureThreshold: 3
                    readiness: *probes
                    startup:
                      enabled: true
                      custom: true
                      spec:
                        httpGet:
                          path: /api/v1/settings/public
                          port: *port
                        periodSeconds: 5
                        timeoutSeconds: 3
                        failureThreshold: 30
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities: { drop: ["ALL"] }
                  resources:
                    requests:
                      cpu: 10m
                    limits:
                      memory: 1Gi
          defaultPodOptions:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
          service:
            app:
              controller: seerr
              ports:
                http:
                  port: *port
          route:
            # -- Enable and configure route settings for the chart under this key.
            main:
              parentRefs:
                - name: internal
                  namespace: gateway
              hostnames:
                - seerr-k8s.<path:cluster-secrets:cluster-secrets#domain>
                - requests.<path:cluster-secrets:cluster-secrets#domain>
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - kind: Service
                      port: *port
                      name: seerr
                      namespace: seerr
                      weight: 1
          persistence:
            config:
              existingClaim: seerr-config
              globalMounts:
                - path: /app/config
            cache:
              existingClaim: seerr-cache
              globalMounts:
                - path: /app/config/cache
            logs:
              type: emptyDir
              globalMounts:
                - path: /app/config/logs
            tmp:
              type: emptyDir
