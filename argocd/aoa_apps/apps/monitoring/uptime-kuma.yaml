apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: in-cluster
    namespace: uptime-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.3.0
    helm:
      releaseName: uptime-kuma
      valuesObject:
        controllers:
          uptime-kuma:
            containers:
              app:
                image:
                  repository: louislam/uptime-kuma
                  # renovate: datasource=docker depName=louislam/uptime-kuma
                  tag: 2.5.11
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      exec:
                        command:
                          - extra/healthcheck
                      initialDelaySeconds: 180
                      periodSeconds: 10
                      timeoutSeconds: 2
                      failureThreshold: 3
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: &port 3001
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 1
                      failureThreshold: 3

        service:
          app:
            controller: uptime-kuma
            ports:
              http:
                port: *port

        route:
          main:
            parentRefs:
              - name: internal
                namespace: gateway
            hostnames:
              - uptime-kuma-k8s.<path:cluster-secrets:cluster-secrets#domain>
              - status.<path:cluster-secrets:cluster-secrets#domain>
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - kind: Service
                    port: *port
                    name: uptime-kuma
                    namespace: uptime-kuma
                    weight: 1

        persistence:
          data:
            existingClaim: uptime-kuma
            globalMounts:
              - path: /app/data
